# ========================================
# coturn STUN/TURN Server Configuration
# ========================================
# Self-hostable ICE server for peer.cat
#
# Customize these settings for your deployment:
#   - Change realm to your domain
#   - Set a strong static-auth-secret
#   - Update external-ip if behind NAT

# Listening port
listening-port=3478

# STUN + TURN
lt-cred-mech

# Realm (set to your domain)
realm=peer.cat

# Static auth secret (CHANGE THIS in production)
static-auth-secret=peer-cat-turn-secret-change-me

# Total quota
total-quota=100

# Max bytes-per-second per session (10 MB/s)
max-bps=10000000

# Logging
log-file=stdout
no-stdout-log

# Security
no-multicast-peers
no-tlsv1
no-tlsv1_1

# Relay port range
min-port=49152
max-port=49200

# Fingerprint for message integrity
fingerprint

# If behind NAT, uncomment and set your external IP:
# external-ip=YOUR_PUBLIC_IP/YOUR_PRIVATE_IP
